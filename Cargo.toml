[package]
name = "kurika-meguri"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"]}
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls"]}
dotenvy = "0.15.7"
serde = "1.0.229"
rand = { version = "0.10.2", features = ["thread_rng"] }